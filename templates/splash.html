<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>{{ cafe_name }}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:#1A1210;
  color:#F5E6C8;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
  padding:24px;
}

.logo-wrap{
  width:96px;height:96px;border-radius:24px;
  overflow:hidden;
  background:#2A1F14;
  display:flex;align-items:center;justify-content:center;
  font-size:42px;
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
  flex-shrink:0;
}
.logo-wrap img{width:100%;height:100%;object-fit:cover}

.cafe-name{
  font-size:1.55rem;font-weight:700;
  text-align:center;
  color:#F5E6C8;
  line-height:1.25;
  max-width:280px;
}

.tagline{
  font-size:0.82rem;
  color:#A08050;
  text-align:center;
}

/* Loading dots */
.dots{display:flex;gap:7px;height:16px;align-items:center}
.dot{
  width:8px;height:8px;border-radius:50%;
  background:#C9A84C;
  animation:pop 1.3s ease-in-out infinite;
  opacity:0.4;
}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes pop{
  0%,60%,100%{transform:translateY(0);opacity:0.4}
  30%{transform:translateY(-7px);opacity:1}
}

/* Button */
.btn{
  margin-top:8px;
  padding:15px 44px;
  background:linear-gradient(135deg,#C9A84C,#F5A623);
  color:#1A1210;
  border:none;border-radius:16px;
  font-size:1.05rem;font-weight:700;
  cursor:pointer;
  letter-spacing:0.3px;
  box-shadow:0 4px 20px rgba(201,168,76,0.35);
  opacity:0;
  transform:translateY(12px) scale(0.96);
  transition:opacity 0.35s ease, transform 0.35s ease;
  pointer-events:none;
}
.btn.visible{
  opacity:1;
  transform:translateY(0) scale(1);
  pointer-events:auto;
}
.btn:active{transform:scale(0.97)}
</style>
</head>
<body>

<div class="logo-wrap" id="logo-wrap">
  {% if cafe_logo %}
  <img src="{{ cafe_logo }}" alt="" id="logo-img">
  {% else %}
  <span>{{ cafe_icon }}</span>
  {% endif %}
</div>

<div class="cafe-name">{{ cafe_name }}</div>
<div class="tagline" id="tagline">Menyu yüklənir...</div>

<div class="dots" id="dots">
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
</div>

<button class="btn" id="btn" onclick="goMenu()">Menüya keç &rarr;</button>

<script>
var MENU_URL = '/menu/{{ username }}';
var menuReady = false;
var minTime   = false;
var navigated = false;

function goMenu() {
  if (navigated) return;
  navigated = true;
  window.location.href = MENU_URL;
}

function tryReveal() {
  if (!menuReady || !minTime) return;
  document.getElementById('dots').style.display = 'none';
  document.getElementById('tagline').textContent = 'Menyu hazırdır!';
  var btn = document.getElementById('btn');
  btn.classList.add('visible');
  // Auto-navigate 1.2s after ready (user sees "Menyu hazırdır!" briefly)
  setTimeout(goMenu, 1200);
}

// Fetch menu page into browser cache immediately
fetch(MENU_URL, {cache:'force-cache'}).then(function() {
  menuReady = true;
  tryReveal();
}).catch(function() {
  menuReady = true;
  tryReveal();
});

// Minimum splash display: 1.5s so user sees the cafe name
setTimeout(function() {
  minTime = true;
  tryReveal();
}, 1500);

// Hard timeout: navigate after 6s regardless
setTimeout(goMenu, 6000);
</script>
</body>
</html>
