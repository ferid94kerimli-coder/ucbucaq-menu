name: Daily DB Backup

on:
  schedule:
    - cron: '0 2 * * *'  # Hər gün saat 02:00 UTC
  workflow_dispatch:       # Manual işlətmə imkanı

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          DATE=$(date +%Y-%m-%d)
          pg_dump "$DATABASE_URL" \
            --no-password \
            --format=custom \
            --no-acl \
            --no-owner \
            -f "backup_${DATE}.dump"
          echo "Backup size: $(du -sh backup_${DATE}.dump | cut -f1)"

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup_*.dump
          retention-days: 30
