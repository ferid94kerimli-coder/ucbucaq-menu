name: Daily DB Backup

on:
  schedule:
    - cron: '0 2 * * *'  # Hər gün saat 02:00 UTC
  workflow_dispatch:       # Manual işlətmə imkanı

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install psycopg2
        run: pip install psycopg2-binary

      - name: Dump database to JSON
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python3 - <<'EOF'
          import os, json, psycopg2
          from psycopg2.extras import RealDictCursor
          from datetime import date

          conn = psycopg2.connect(os.environ['DATABASE_URL'], cursor_factory=RealDictCursor)
          cur = conn.cursor()

          backup = {}

          cur.execute("SELECT * FROM users")
          backup['users'] = [dict(r) for r in cur.fetchall()]
          for row in backup['users']:
              for k, v in row.items():
                  if hasattr(v, 'isoformat'):
                      row[k] = v.isoformat()

          cur.execute("SELECT username, data FROM user_data")
          backup['user_data'] = [dict(r) for r in cur.fetchall()]

          conn.close()

          fname = f"backup_{date.today()}.json"
          with open(fname, 'w', encoding='utf-8') as f:
              json.dump(backup, f, ensure_ascii=False, indent=2, default=str)

          size = os.path.getsize(fname)
          users_count = len(backup['users'])
          print(f"Backup: {fname} | {size} bytes | {users_count} users")
          EOF

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup_*.dump
          retention-days: 30
